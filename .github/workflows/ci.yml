name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: kairos-dist
          path: dist
          retention-days: 7
  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: pnpm build
      - run: npx playwright install --with-deps chromium
      - run: node tests/e2e/smoke.mjs
  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kairos:ci .
      - name: Boot container and probe health
        run: |
          docker run -d --name kairos -p 8787:8787 kairos:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/api/health && break || sleep 1; done
          curl -sf http://127.0.0.1:8787/api/health
          docker logs kairos
          docker rm -f kairos
